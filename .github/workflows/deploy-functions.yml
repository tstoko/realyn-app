name: Deploy Cloud Functions & Rules

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

# Rollback: firebase functions:delete <functionName> --project realyn-app
# Or redeploy previous commit: git revert + push to main
#
# IAM history (kept for context if a future deploy regresses on permissions):
# FIREBASE_SERVICE_ACCOUNT_REALYN_APP previously only had Cloud-Functions-level
# permissions, so PR #20 and #21 stripped `storage` and `firestore:rules`/
# `firestore:indexes` from the `--only` flag. Without the IAM grants below,
# bundling those targets makes the whole deploy abort on the first 403.
#
# Re-enabled 2026-05-17 after granting the following roles to
# github-action-1093841209@realyn-app.iam.gserviceaccount.com:
#   - roles/firebasestorage.admin   (firebasestorage.defaultBucket.get + write)
#   - roles/firebaserules.admin     (firebaserules.releases.test/update)
#   - roles/datastore.viewer        (already present; needed for index reads)
#
# `storage` is still deliberately excluded from `--only` until Firebase Storage
# is initialised on the realyn-app project. Today the project has no default
# bucket, so `firebase deploy --only storage` aborts with:
#   "Firebase Storage has not been set up on project 'realyn-app'.
#    Go to https://console.firebase.google.com/project/realyn-app/storage
#    and click 'Get Started' to set up Firebase Storage."
# This is a one-time, human-only action (the console flow forces a region
# pick). Once it's done, add `,storage` back to the `--only` flag in the deploy
# step below — the IAM grants above are already sufficient.
#
# If a future deploy starts failing on rule/storage IAM again, the fastest
# diagnostic is `gcloud projects get-iam-policy realyn-app --flatten='bindings[].members'
# --filter='bindings.members:github-action-1093841209@realyn-app.iam.gserviceaccount.com'`
# — confirm the three roles above are still bound.

jobs:
  deploy:
    name: Deploy Functions + Firestore/Storage Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install root workspace deps first so packages/ai-core has node_modules
      # (typescript, zod, @anthropic-ai/sdk, @pinecone-database/pinecone, etc.).
      # Without this, `npm run build` in packages/ai-core fails with a flood of
      # TS2304/TS2307/TS2591/TS2584 errors and the whole deploy aborts.
      # Mirrors the working order in deploy-staging.yml.
      - name: Install root workspace dependencies
        run: npm ci

      - name: Build AI Core
        run: npm run build
        working-directory: packages/ai-core

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Pack AI Core for Functions runtime
        run: |
          AI_CORE_PACK="$(npm pack ../packages/ai-core --pack-destination .)"
          npm pkg set "dependencies.@realyn/ai-core=file:${AI_CORE_PACK}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: functions

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.15.0
        with:
          args: deploy --only functions,firestore:rules,firestore:indexes --project realyn-app
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REALYN_APP }}
