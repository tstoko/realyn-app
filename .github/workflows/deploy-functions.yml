name: Deploy Cloud Functions & Rules

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

# Rollback: firebase functions:delete <functionName> --project realyn-app
# Or redeploy previous commit: git revert + push to main
#
# IAM NOTE: FIREBASE_SERVICE_ACCOUNT_REALYN_APP currently only has the
# permissions needed to deploy Cloud Functions. Bundling other Firebase
# targets into the same `firebase deploy` invocation makes the entire
# job abort on the first permission check that fails.
#
# Excluded targets and what to grant before re-adding each:
#
#   storage         — needs `firebasestorage.defaultBucket.get`
#                     (roles/firebasestorage.admin or custom role)
#
#   firestore:rules — needs `firebaserules.releases.test`
#                     (roles/firebaserules.admin or custom role)
#
#   firestore:indexes — bundled with firestore:rules; same blast radius
#                       (roles/datastore.indexAdmin)
#
# After granting the IAM roles, re-add the targets to the `--only` flag.
# Until then, rule/index/storage changes must be deployed separately by
# a human with broader credentials (e.g.
#   `firebase deploy --only firestore:rules --project realyn-app`
# from a workstation with ADC for an owner-level account).
#
# Pending undeployed rule changes since the last successful prod deploy
# (2026-03-26, draftargument-00017-nez):
#   a9306b8 — ticketing evidence copy, read-only disputes
#   0d88b08 — Release rollout
#   2af21f9 — RAG groundwork
#   eb337f8 — winPatterns rule decision
# None of these block RAG running; they tighten the rule schema.

jobs:
  deploy:
    name: Deploy Functions + Firestore/Storage Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install root workspace deps first so packages/ai-core has node_modules
      # (typescript, zod, @anthropic-ai/sdk, @pinecone-database/pinecone, etc.).
      # Without this, `npm run build` in packages/ai-core fails with a flood of
      # TS2304/TS2307/TS2591/TS2584 errors and the whole deploy aborts.
      # Mirrors the working order in deploy-staging.yml.
      - name: Install root workspace dependencies
        run: npm ci

      - name: Build AI Core
        run: npm run build
        working-directory: packages/ai-core

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Pack AI Core for Functions runtime
        run: |
          AI_CORE_PACK="$(npm pack ../packages/ai-core --pack-destination .)"
          npm pkg set "dependencies.@realyn/ai-core=file:${AI_CORE_PACK}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: functions

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.15.0
        with:
          args: deploy --only functions --project realyn-app
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REALYN_APP }}
