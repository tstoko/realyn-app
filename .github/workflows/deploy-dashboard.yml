name: Deploy Dashboard to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'packages/dashboard/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build:dashboard
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REALYN_APP }}
          channelId: live
          projectId: realyn-app
          target: dashboard
