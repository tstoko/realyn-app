name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview_website:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build:website
        env:
          VITE_ENVIRONMENT: production
          VITE_FIREBASE_PROJECT_ID: realyn-app
          VITE_FIREBASE_FUNCTIONS_URL: https://us-central1-realyn-app.cloudfunctions.net
          VITE_FIREBASE_REGION: us-central1
          VITE_FIREBASE_AUTH_DOMAIN: realyn-app.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: realyn-app.firebasestorage.app
          VITE_DASHBOARD_URL: ${{ vars.WEBSITE_VITE_DASHBOARD_URL || 'https://dashboard.realyn.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.DASHBOARD_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DASHBOARD_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.DASHBOARD_VITE_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REALYN_APP }}
          projectId: realyn-app
          target: website
  build_and_preview_dashboard:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build:dashboard
        env:
          VITE_ENVIRONMENT: production
          VITE_FIREBASE_PROJECT_ID: realyn-app
          VITE_FIREBASE_FUNCTIONS_URL: https://us-central1-realyn-app.cloudfunctions.net
          VITE_FIREBASE_REGION: us-central1
          VITE_FIREBASE_AUTH_DOMAIN: realyn-app.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: realyn-app.firebasestorage.app
          VITE_WEBSITE_URL: ${{ vars.DASHBOARD_VITE_WEBSITE_URL || 'https://realyn.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.DASHBOARD_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DASHBOARD_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.DASHBOARD_VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.DASHBOARD_VITE_STRIPE_PRICE_STARTER_MONTHLY }}
          VITE_STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.DASHBOARD_VITE_STRIPE_PRICE_STARTER_YEARLY }}
          VITE_STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ secrets.DASHBOARD_VITE_STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
          VITE_STRIPE_PRICE_PROFESSIONAL_YEARLY: ${{ secrets.DASHBOARD_VITE_STRIPE_PRICE_PROFESSIONAL_YEARLY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REALYN_APP }}
          projectId: realyn-app
          target: dashboard
